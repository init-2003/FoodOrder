<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    # These vendor scripts retain their legacy URLs in the PHP views.
    AliasMatch "^/public/assets/vendor/(alpine|sweetalert2)\.min\.js$" "/var/www/html/public/assets/vendor/$1.min.js"

    <Directory /var/www/html/public>
        Options -Indexes -MultiViews
        AllowOverride FileInfo
        Require all granted

        <FilesMatch "^\.">
            Require all denied
        </FilesMatch>
    </Directory>
</VirtualHost>
