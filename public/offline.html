<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fb784c">
  <title>อันเกิม - ร้านอาหารเวียดนาม</title>
  <link rel="icon" href="assets/images/restaurant-logo.svg" type="image/svg+xml">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: #f8f9f6; color: #26362e; font-family: system-ui, sans-serif; text-align: center; }
    main { width: min(100%, 360px); padding: 36px 24px; background: #fff; border: 1px solid #e9ede5; border-radius: 20px; }
    .mark { width: 56px; height: 56px; margin: 0 auto 20px; display: grid; place-items: center; border-radius: 18px; background: #fff0e9; color: #e9683f; font-size: 28px; }
    h1 { margin: 0 0 10px; font-size: 21px; }
    p { margin: 0 0 24px; color: #6f7c72; line-height: 1.6; }
    button { width: 100%; min-height: 48px; border: 0; border-radius: 999px; background: #fa784e; color: white; font: inherit; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body><main><div class="mark" aria-hidden="true">!</div><h1>ยังไม่มีการเชื่อมต่อ</h1><p>กรุณาตรวจสอบการเชื่อมต่ออินเทอร์เน็ต แล้วลองใหม่อีกครั้ง</p><button type="button" onclick="location.reload()">ลองอีกครั้ง</button></main></body>
</html>
